# Временный vhost для ACME: приложение по незашифрованному HTTP не публикуется.
server {
    listen 80;
    server_name beinirest.ru www.beinirest.ru;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/beini-acme;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
