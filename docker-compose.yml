version: '3.8'

services:
  beini-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: beini-backend:latest
    container_name: beini_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TZ=Europe/Moscow
    volumes:
      - ./iiko_config.json:/app/iiko_config.json:ro
